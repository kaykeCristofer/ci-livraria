<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livraria TDD</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #F3EFE6; color: #1C1B19;
           max-width: 640px; margin: 64px auto; padding: 0 24px; }
    h1 { font-size: 48px; margin-bottom: 8px; }
    .selo { display: inline-block; background: #276A4C; color: #F3EFE6;
            padding: 6px 14px; border-radius: 999px; font-family: monospace; }
    li { font-size: 20px; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>📚 Livraria TDD</h1>
  <p class="selo">versão 1 · publicado pelo GitHub Actions</p>
  <h2>Livros em destaque</h2>
  <ul>
    <li>Test-Driven Development: By Example — Kent Beck</li>
    <li>Engenharia de Software — Ian Sommerville</li>
    <li>Clean Code — Robert C. Martin</li>
  </ul>
  <p>Este site só é publicado quando todos os testes passam.</p>
</body>
</html>
